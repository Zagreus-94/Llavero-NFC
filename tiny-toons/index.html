<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tiny Toon Adventures NFC</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; user-select: none; }
    
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #0d0d0d; color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
    }

    .screen-wrapper {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      padding: 15px;
    }

    .card-container {
      width: 100%;
      max-width: 330px;
      padding: 20px 16px;
      background: #131828;
      border: 4px solid #3b82f6;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
      text-align: center;
    }

    h1 { font-size: 11px; line-height: 1.3; color: #3b82f6; margin: 0 0 8px 0; }
    p.subtitle { font-size: 7px; line-height: 1.4; color: #a0a0b0; margin-bottom: 16px; }

    .pin-box {
      width: 100%; padding: 12px;
      font-family: 'Press Start 2P', monospace; font-size: 16px;
      text-align: center; letter-spacing: 6px;
      background-color: #050508; border: 2px solid #3a3a4c;
      border-radius: 8px; color: #3b82f6; outline: none;
    }
    .pin-box:focus { border-color: #3b82f6; }

    .btn-submit {
      width: 100%; margin-top: 14px; padding: 12px;
      font-family: 'Press Start 2P', monospace; font-size: 10px;
      color: #ffffff; background-color: #3b82f6;
      border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 4px 0 #1d4ed8;
      font-weight: bold;
    }
    .btn-submit:active { transform: translateY(4px); box-shadow: 0 0 0 #1d4ed8; }
    
    #error-msg { font-size: 8px; color: #ff4d4d; margin-top: 10px; min-height: 12px; }

    #game-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: none;
      z-index: 1;
      background-color: #000;
    }

    #game { width: 100% !important; height: 100% !important; }

    #game canvas {
      width: 100% !important;
      max-height: 60vh !important;
      object-fit: contain !important;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE BLOQUEO -->
  <div id="lock-wrapper" class="screen-wrapper">
    <div class="card-container">
      <h1>TINY TOON ADVENTURES</h1>
      <p class="subtitle">Ingresa el PIN de tu Tarjeta de Autenticidad</p>
      
      <input 
        type="password" 
        id="pin-input" 
        class="pin-box" 
        maxlength="4" 
        placeholder="••••"
        inputmode="numeric"
      >
      
      <button class="btn-submit" onclick="validarPin()">DESBLOQUEAR</button>
      <div id="error-msg"></div>
    </div>
  </div>

  <!-- CONTENEDOR DEL EMULADOR -->
  <div id="game-container">
    <div id="game"></div>
  </div>

  <script type="text/javascript">
    const PIN_CORRECTO = "1998";

    window.onload = function() {
      if (localStorage.getItem("llavero_tinytoons_autenticado") === "true") {
        iniciarJuego();
      }
    };

    function validarPin() {
      const pinIngresado = document.getElementById("pin-input").value;
      if (pinIngresado === PIN_CORRECTO) {
        localStorage.setItem("llavero_tinytoons_autenticado", "true");
        iniciarJuego();
      } else {
        document.getElementById("error-msg").innerText = "PIN INCORRECTO. REVISA TU TARJETA.";
        document.getElementById("pin-input").value = "";
      }
    }

    function iniciarJuego() {
      document.getElementById("lock-wrapper").style.display = "none";
      document.getElementById("game-container").style.display = "block";

      window.EJS_player = "#game";
      window.EJS_core = "nes";
      window.EJS_gameUrl = "tinytoons.nes";
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

      const script = document.createElement("script");
      script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      document.body.appendChild(script);
    }
  </script>

</body>
</html>
