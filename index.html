<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tiny Toon NFC</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; user-select: none; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #0d0d0d; color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
    }
    .card-container {
      width: 90%; max-width: 360px;
      padding: 28px 20px;
      background: #1a1a24;
      border: 4px solid #e60012;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(230, 0, 18, 0.3);
      text-align: center;
      z-index: 10;
    }
    .badge-icon { font-size: 32px; margin-bottom: 15px; }
    h1 { font-size: 13px; line-height: 1.5; color: #e60012; margin: 0 0 15px 0; }
    p.subtitle { font-size: 8px; line-height: 1.6; color: #a0a0b0; margin-bottom: 20px; }
    .pin-box {
      width: 100%; padding: 14px;
      font-family: 'Press Start 2P', monospace; font-size: 18px;
      text-align: center; letter-spacing: 8px;
      background-color: #050508; border: 2px solid #3a3a4c;
      border-radius: 8px; color: #ff4d4d; outline: none;
    }
    .pin-box:focus { border-color: #e60012; }
    .btn-submit {
      width: 100%; margin-top: 18px; padding: 14px;
      font-family: 'Press Start 2P', monospace; font-size: 10px;
      color: #ffffff; background-color: #e60012;
      border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 4px 0 #99000c;
    }
    .btn-submit:active { transform: translateY(4px); box-shadow: 0 0 0 #99000c; }
    #error-msg { font-size: 8px; color: #ff4d4d; margin-top: 15px; min-height: 12px; }
    
    /* Contenedor del emulador */
    #game-container {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE BLOQUEO -->
  <div id="lock-screen" class="card-container">
    <div class="badge-icon">🐰</div>
    <h1>TINY TOONS CLUB</h1>
    <p class="subtitle">Ingresa el PIN de tu Tarjeta de Autenticidad</p>
    
    <input 
      type="password" 
      id="pin-input" 
      class="pin-box" 
      maxlength="4" 
      placeholder="••••"
      inputmode="numeric"
    >
    
    <button class="btn-submit" onclick="validarPin()">DESBLOQUEAR</button>
    <div id="error-msg"></div>
  </div>

  <!-- CONTENEDOR DEL EMULADOR -->
  <div id="game-container">
    <div id="game"></div>
  </div>

  <script type="text/javascript">
    const PIN_CORRECTO = "1991";

    window.onload = function() {
      if (localStorage.getItem("llavero_tinytoons_autenticado") === "true") {
        iniciarJuego();
      }
    };

    function validarPin() {
      const pinIngresado = document.getElementById("pin-input").value;
      if (pinIngresado === PIN_CORRECTO) {
        localStorage.setItem("llavero_tinytoons_autenticado", "true");
        iniciarJuego();
      } else {
        document.getElementById("error-msg").innerText = "PIN INCORRECTO. REVISA TU TARJETA.";
        document.getElementById("pin-input").value = "";
      }
    }

    function iniciarJuego() {
      document.getElementById("lock-screen").style.display = "none";
      document.getElementById("game-container").style.display = "block";

      // Variables globales requeridas por EmulatorJS
      window.EJS_player = "#game";
      window.EJS_core = "nes";
      window.EJS_gameUrl = "tinytoons.nes"; // Debe coincidir exactamente con el nombre en GitHub
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

      // Cargar dinámicamente el loader
      const script = document.createElement("script");
      script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      document.body.appendChild(script);
    }
  </script>

</body>
</html>
